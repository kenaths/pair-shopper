            border-radius: 50%;

<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Utility function to compress images
        const compressImage = (file, maxWidth = 1024, maxHeight = 1024, quality = 0.8) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // Calculate new dimensions
                        if (width > height) {
                            if (width > maxWidth) {
                                height = height * (maxWidth / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = width * (maxHeight / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        };

        // Lucide icons as inline SVG components

        const PairShopperApp = () => {
          const [activeTab, setActiveTab] = useState('capture');
          const [capturedImages, setCapturedImages] = useState([]);
          const [cartItems, setCartItems] = useState([]);
          const [billText, setBillText] = useState('');
          const [billItems, setBillItems] = useState([]);
          const [discrepancies, setDiscrepancies] = useState([]);
          const [showComparison, setShowComparison] = useState(false);
          const [isProcessing, setIsProcessing] = useState(false);
          const [editingItem, setEditingItem] = useState(null);
          const [quantityInput, setQuantityInput] = useState({});
          const [supermarket, setSupermarket] = useState('glomark');
          const [isSaturday, setIsSaturday] = useState(false);
          const [useDemoMode, setUseDemoMode] = useState(true);
          const [compressionStatus, setCompressionStatus] = useState('');
          
          const fileInputRef = useRef(null);
          const videoRef = useRef(null);
          const canvasRef = useRef(null);
          const [isCameraActive, setIsCameraActive] = useState(false);
          const importInputRef = useRef(null);

          const discountRules = {
            glomark: {
              saturday: 0.20,
              items: ['milk powder', 'anchor', 'dhal', 'sugar', 'flour', 'rice']
            }
          };

          // Load data from localStorage on mount
          useEffect(() => {
            try {
              const savedCart = JSON.parse(localStorage.getItem('pairShopper_cart') || '[]');
              const savedImages = JSON.parse(localStorage.getItem('pairShopper_images') || '[]');
              const savedBill = localStorage.getItem('pairShopper_bill') || '';
              
              if (savedCart.length > 0) setCartItems(savedCart);
              if (savedImages.length > 0) setCapturedImages(savedImages);
              if (savedBill) setBillText(savedBill);
            } catch (e) {
              console.error('Error loading saved data:', e);
            }
          }, []);

          // Save to localStorage whenever data changes
          useEffect(() => {
            try {
              localStorage.setItem('pairShopper_cart', JSON.stringify(cartItems));
            } catch (e) {
              console.error('Error saving cart:', e);
            }
          }, [cartItems]);

          useEffect(() => {
            try {
              localStorage.setItem('pairShopper_images', JSON.stringify(capturedImages));
            } catch (e) {
              console.error('Error saving images:', e);
            }
          }, [capturedImages]);

          useEffect(() => {
            try {
              localStorage.setItem('pairShopper_bill', billText);
            } catch (e) {
              console.error('Error saving bill:', e);
            }
          }, [billText]);

          const processImageOCR = async (imageData) => {
            setIsProcessing(true);
            
            if (useDemoMode) {
              await new Promise(resolve => setTimeout(resolve, 1000));
              const sampleItems = [
                { name: 'Carrots Local', price: 180.00, unitPrice: '360/kg', weight: '500g', confidence: 0.95 },
                { name: 'Anchor Milk Powder 400g', price: 890.00, confidence: 0.92 },
                { name: 'Wheat Bread', price: 120.00, confidence: 0.88 },
                { name: 'Red Onions', price: 75.50, unitPrice: '151/kg', weight: '500g', confidence: 0.90 },
                { name: 'Dhal 500g', price: 250.00, confidence: 0.93 }
              ];
              const randomItem = sampleItems[Math.floor(Math.random() * sampleItems.length)];
              setIsProcessing(false);
              return {
                ...randomItem,
                expectedDiscount: checkExpectedDiscount(randomItem.name)
              };
            }
            
            try {
              const { data: { text, confidence } } = await Tesseract.recognize(
                imageData,
                'eng',
                {
                  logger: m => {
                    if (m.status === 'recognizing text') {
                      console.log(`OCR Progress: ${Math.round(m.progress * 100)}%`);
                    }
                  }
                }
              );

              console.log('Extracted text:', text);
              const parsed = parseOCRText(text);
              
              setIsProcessing(false);
              return {
                ...parsed,
                confidence: confidence / 100,
                expectedDiscount: checkExpectedDiscount(parsed.name)
              };
            } catch (error) {
              console.error('OCR Error:', error);
              setIsProcessing(false);
              
              return {
                name: 'Unknown Item',
                price: 0,
                confidence: 0.5,
                expectedDiscount: 0,
                error: 'OCR failed - please edit manually'
              };
            }
          };

          const parseOCRText = (text) => {
            const cleanText = text.replace(/\s+/g, ' ').trim();
            console.log('Parsing:', cleanText);

            const pricePatterns = [
              /(?:Rs\.?\s*|LKR\s*)?(\d+\.?\d*)/gi,
              /(\d+\.\d{2})/g,
              /(\d{2,})/g
            ];

            let prices = [];
            for (const pattern of pricePatterns) {
              const matches = cleanText.matchAll(pattern);
              for (const match of matches) {
                const price = parseFloat(match[1]);
                if (price > 0 && price < 100000) {
                  prices.push(price);
                }
              }
            }

            const unitPriceMatch = cleanText.match(/(\d+\.?\d*)\s*(?:\/|per)\s*(?:kg|g|l|ml)/i);
            let unitPrice = unitPriceMatch ? unitPriceMatch[0] : null;

            const weightMatch = cleanText.match(/(\d+\.?\d*)\s*(?:kg|g|ml|l)/i);
            let weight = weightMatch ? weightMatch[0] : null;

            const lines = cleanText.split('\n').filter(l => l.trim());
            let itemName = 'Unknown Item';
            
            for (const line of lines) {
              if (line.match(/^\s*(?:Rs\.?\s*)?[\d\.\s]+$/)) continue;
              if (line.length > 3 && line.match(/[a-zA-Z]{3,}/)) {
                itemName = line.trim().replace(/Rs\.?\s*[\d\.]+/g, '').trim();
                if (itemName.length > 2) break;
              }
            }

            const price = prices.length > 0 ? Math.max(...prices) : 0;

            return {
              name: itemName || 'Unknown Item',
              price: price,
              unitPrice: unitPrice,
              weight: weight
            };
          };

          const checkExpectedDiscount = (itemName) => {
            if (supermarket === 'glomark' && isSaturday) {
              const lowercaseName = itemName.toLowerCase();
              const hasDiscount = discountRules.glomark.items.some(item => 
                lowercaseName.includes(item)
              );
              return hasDiscount ? discountRules.glomark.saturday : 0;
            }
            return 0;
          };

          const handleFileUpload = async (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            setCompressionStatus(`Compressing ${files.length} image(s)...`);

            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              try {
                setCompressionStatus(`Compressing ${i + 1}/${files.length}...`);
                
                // Compress the image before processing
                const compressedImage = await compressImage(file, 1024, 1024, 0.8);
                
                setCompressionStatus(`Processing ${i + 1}/${files.length}...`);
                const ocrResult = await processImageOCR(compressedImage);
                
                const newImage = {
                  id: Date.now() + Math.random(),
                  imageData: compressedImage,
                  ocrResult,
                  confirmed: false,
                  timestamp: new Date().toISOString()
                };
                
                setCapturedImages(prev => [...prev, newImage]);
              } catch (error) {
                console.error('Error processing image:', error);
                alert(`Error processing image ${i + 1}: ${error.message}`);
              }
            }
            
            setCompressionStatus('');
            event.target.value = ''; // Reset input
          };

          const startCamera = async () => {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                  facingMode: 'environment',
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
                } 
              });
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                setIsCameraActive(true);
              }
            } catch (err) {
              console.error('Camera error:', err);
              alert('Camera access denied or not available. Please use file upload instead.');
            }
          };

          const stopCamera = () => {
            if (videoRef.current && videoRef.current.srcObject) {
              const tracks = videoRef.current.srcObject.getTracks();
              tracks.forEach(track => track.stop());
              setIsCameraActive(false);
            }
          };

          const capturePhoto = async () => {
            if (!videoRef.current || !canvasRef.current) return;
            
            const video = videoRef.current;
            const canvas = canvasRef.current;
            
            // Set canvas to a reasonable size
            const maxWidth = 1024;
            const maxHeight = 1024;
            let width = video.videoWidth;
            let height = video.videoHeight;
            
            if (width > height) {
              if (width > maxWidth) {
                height = height * (maxWidth / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = width * (maxHeight / height);
                height = maxHeight;
              }
            }
            
            canvas.width = width;
            canvas.height = height;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            const ocrResult = await processImageOCR(imageData);
            
            const newImage = {
              id: Date.now(),
              imageData,
              ocrResult,
              confirmed: false,
              timestamp: new Date().toISOString()
            };
            
            setCapturedImages(prev => [...prev, newImage]);
          };

          const confirmItem = (imageId, quantity = 1) => {
            const image = capturedImages.find(img => img.id === imageId);
            if (!image) return;

            const cartItem = {
              id: Date.now(),
              ...image.ocrResult,
              quantity: quantity,
              totalPrice: image.ocrResult.price * quantity,
              imageRef: imageId,
              addedAt: new Date().toISOString()
            };

            setCartItems(prev => [...prev, cartItem]);
            setCapturedImages(prev => 
              prev.map(img => 
                img.id === imageId ? { ...img, confirmed: true } : img
              )
            );
          };

          const updateQuantity = (itemId, newQuantity) => {
            if (newQuantity < 1) return;
            setCartItems(prev =>
              prev.map(item =>
                item.id === itemId
                  ? { ...item, quantity: newQuantity, totalPrice: item.price * newQuantity }
                  : item
              )
            );
          };

          const saveEdit = (imageId, editedData) => {
            setCapturedImages(prev =>
              prev.map(img =>
                img.id === imageId
                  ? { ...img, ocrResult: { ...img.ocrResult, ...editedData } }
                  : img
              )
            );
            setEditingItem(null);
          };

          const deleteImage = (imageId) => {
            setCapturedImages(prev => prev.filter(img => img.id !== imageId));
            setCartItems(prev => prev.filter(item => item.imageRef !== imageId));
          };

          const parseBill = () => {
            if (!billText.trim()) {
              alert('Please paste your bill text');
              return;
            }

            const lines = billText.split('\n').filter(line => line.trim());
            const items = [];

            lines.forEach(line => {
              const match = line.match(/^(.+?)\s+(?:Rs\.?\s*)?(\d+\.?\d*)\s*$/);
              if (match) {
                items.push({
                  name: match[1].trim(),
                  price: parseFloat(match[2])
                });
              }
            });

            setBillItems(items);
            if (items.length > 0) {
              setActiveTab('compare');
            } else {
              alert('Could not parse items from bill. Please check format.');
            }
          };

          const compareCartAndBill = () => {
            const issues = [];

            cartItems.forEach(cartItem => {
              const cartName = cartItem.name.toLowerCase().trim();
              
              const billMatch = billItems.find(billItem => {
                const billName = billItem.name.toLowerCase().trim();
                return billName.includes(cartName) || cartName.includes(billName) ||
                       levenshteinDistance(cartName, billName) < 5;
              });

              if (!billMatch) {
                issues.push({
                  type: 'missing',
                  severity: 'high',
                  cartItem: cartItem,
                  message: `Item "${cartItem.name}" not found in bill`
                });
              } else {
                const priceDiff = Math.abs(billMatch.price - cartItem.price);
                if (priceDiff > 0.5) {
                  issues.push({
                    type: 'price_mismatch',
                    severity: 'high',
                    cartItem: cartItem,
                    billItem: billMatch,
                    difference: billMatch.price - cartItem.price,
                    message: `Price mismatch for "${cartItem.name}"`
                  });
                }

                if (cartItem.expectedDiscount > 0) {
                  const expectedPrice = cartItem.price * (1 - cartItem.expectedDiscount);
                  if (billMatch.price > expectedPrice + 0.5) {
                    issues.push({
                      type: 'missing_discount',
                      severity: 'medium',
                      cartItem: cartItem,
                      billItem: billMatch,
                      expectedDiscount: cartItem.expectedDiscount * 100,
                      potentialSaving: billMatch.price - expectedPrice,
                      message: `Saturday discount not applied to "${cartItem.name}"`
                    });
                  }
                }
              }
            });

            billItems.forEach(billItem => {
              const billName = billItem.name.toLowerCase().trim();
              const cartMatch = cartItems.find(cartItem => {
                const cartName = cartItem.name.toLowerCase().trim();
                return billName.includes(cartName) || cartName.includes(billName);
              });

              if (!cartMatch) {
                issues.push({
                  type: 'extra_item',
                  severity: 'medium',
                  billItem: billItem,
                  message: `Extra item "${billItem.name}" in bill (Rs.${billItem.price.toFixed(2)})`
                });
              }
            });

            setDiscrepancies(issues);
            setShowComparison(true);
          };

          const levenshteinDistance = (str1, str2) => {
            const matrix = [];
            for (let i = 0; i <= str2.length; i++) matrix[i] = [i];
            for (let j = 0; j <= str1.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= str2.length; i++) {
              for (let j = 1; j <= str1.length; j++) {
                if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                  matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                  matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                  );
                }
              }
            }
            return matrix[str2.length][str1.length];
          };

          const calculateTotalIssues = () => {
            let overcharge = 0;
            let missedSavings = 0;

            discrepancies.forEach(issue => {
              if (issue.type === 'price_mismatch' && issue.difference > 0) {
                overcharge += issue.difference;
              }
              if (issue.type === 'missing_discount') {
                missedSavings += issue.potentialSaving;
              }
            });

            return { overcharge, missedSavings, total: overcharge + missedSavings };
          };

          // Export data as JSON
          const exportData = () => {
            const data = {
              version: '1.0',
              exportDate: new Date().toISOString(),
              cartItems,
              capturedImages,
              billText,
              supermarket,
              isSaturday
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pair-shopper-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
          };

          // Import data from JSON
          const importData = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = JSON.parse(e.target.result);
                if (data.cartItems) setCartItems(data.cartItems);
                if (data.capturedImages) setCapturedImages(data.capturedImages);
                if (data.billText) setBillText(data.billText);
                if (data.supermarket) setSupermarket(data.supermarket);
                if (typeof data.isSaturday === 'boolean') setIsSaturday(data.isSaturday);
                alert('Data imported successfully!');
              } catch (error) {
                alert('Error importing data. Please check the file format.');
                console.error('Import error:', error);
              }
            };
            reader.readAsText(file);
            event.target.value = '';
          };

          const loadSampleData = () => {
            const sampleImages = [
              {
                id: 1,
                imageData: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgZmlsbD0iI2YzZjRmNiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5DYXJyb3RzIFBob3RvPC90ZXh0Pjwvc3ZnPg==',
                ocrResult: { name: 'Carrots Local', price: 180.00, unitPrice: '360/kg', weight: '500g', confidence: 0.95, expectedDiscount: 0 },
                confirmed: true
              },
              {
                id: 2,
                imageData: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgZmlsbD0iI2YzZjRmNiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5NaWxrIFBvd2RlcjwvdGV4dD48L3N2Zz4=',
                ocrResult: { name: 'Anchor Milk Powder 400g', price: 890.00, confidence: 0.92, expectedDiscount: 0.20 },
                confirmed: true
              },
              {
                id: 3,
                imageData: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgZmlsbD0iI2YzZjRmNiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5CcmVhZCBQaG90bzwvdGV4dD48L3N2Zz4=',
                ocrResult: { name: 'Wheat Bread', price: 120.00, confidence: 0.88, expectedDiscount: 0 },
                confirmed: true
              }
            ];

            const sampleCart = sampleImages.map((img, idx) => ({
              id: idx + 1,
              ...img.ocrResult,
              quantity: idx === 1 ? 2 : 1,
              totalPrice: img.ocrResult.price * (idx === 1 ? 2 : 1),
              imageRef: img.id,
              addedAt: new Date().toISOString()
            }));

            const sampleBill = `GLOMARK SUPERMARKET
Invoice #12345
Date: 2025-10-12

Carrots Local          220.00
Anchor Milk Powder     890.00
Premium Bread          120.00
Sugar 1kg              180.00

Total: Rs.1410.00`;

            setCapturedImages(sampleImages);
            setCartItems(sampleCart);
            setBillText(sampleBill);
            setIsSaturday(true);
            setSupermarket('glomark');
            setUseDemoMode(true);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
              <div className="bg-white shadow-sm border-b">
                <div className="max-w-4xl mx-auto px-4 py-4">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <Camera className="w-8 h-8 text-indigo-600" />
                      <div>
                        <h1 className="text-2xl font-bold text-gray-900">Pair Shopper</h1>
                        <p className="text-sm text-gray-600">Snap, scan, and save!</p>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={exportData}
                        className="text-sm px-3 py-2 bg-green-100 hover:bg-green-200 rounded-lg transition-colors flex items-center gap-1"
                        title="Export data"
                      >
                        <Download className="w-4 h-4" />
                        <span className="hidden sm:inline">Export</span>
                      </button>
                      <button
                        onClick={() => importInputRef.current?.click()}
                        className="text-sm px-3 py-2 bg-blue-100 hover:bg-blue-200 rounded-lg transition-colors flex items-center gap-1"
                        title="Import data"
                      >
                        <UploadCloud className="w-4 h-4" />
                        <span className="hidden sm:inline">Import</span>
                      </button>
                      <button
                        onClick={loadSampleData}
                        className="text-sm px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors"
                      >
                        Demo
                      </button>
                    </div>
                  </div>

                  <input
                    ref={importInputRef}
                    type="file"
                    accept="application/json"
                    onChange={importData}
                    className="hidden"
                  />

                  <div className="mt-4 flex gap-4 items-center flex-wrap">
                    <div className="flex items-center gap-2">
                      <label className="text-sm font-medium text-gray-700">Store:</label>
                      <select
                        value={supermarket}
                        onChange={(e) => setSupermarket(e.target.value)}
                        className="px-3 py-1 border rounded-lg text-sm"
                      >
                        <option value="glomark">Glomark</option>
                        <option value="keells">Keells</option>
                        <option value="cargills">Cargills</option>
                      </select>
                    </div>
                    <label className="flex items-center gap-2 text-sm">
                      <input
                        type="checkbox"
                        checked={isSaturday}
                        onChange={(e) => setIsSaturday(e.target.checked)}
                        className="rounded"
                      />
                      <span className="font-medium text-gray-700">Saturday (20% off)</span>
                    </label>
                    <label className="flex items-center gap-2 text-sm">
                      <input
                        type="checkbox"
                        checked={useDemoMode}
                        onChange={(e) => setUseDemoMode(e.target.checked)}
                        className="rounded"
                      />
                      <span className="font-medium text-gray-700">Demo OCR</span>
                    </label>
                  </div>
                </div>
              </div>

              <div className="max-w-4xl mx-auto px-4 mt-6">
                <div className="flex gap-2 border-b overflow-x-auto">
                  <button
                    onClick={() => setActiveTab('capture')}
                    className={`px-4 py-3 font-medium transition-colors whitespace-nowrap ${
                      activeTab === 'capture'
                        ? 'text-indigo-600 border-b-2 border-indigo-600'
                        : 'text-gray-600 hover:text-gray-900'
                    }`}
                  >
                    📸 Capture ({capturedImages.length})
                  </button>
                  <button
                    onClick={() => setActiveTab('cart')}
                    className={`px-4 py-3 font-medium transition-colors whitespace-nowrap ${
                      activeTab === 'cart'
                        ? 'text-indigo-600 border-b-2 border-indigo-600'
                        : 'text-gray-600 hover:text-gray-900'
                    }`}
                  >
                    🛒 Cart ({cartItems.length})
                  </button>
                  <button
                    onClick={() => setActiveTab('bill')}
                    className={`px-4 py-3 font-medium transition-colors whitespace-nowrap ${
                      activeTab === 'bill'
                        ? 'text-indigo-600 border-b-2 border-indigo-600'
                        : 'text-gray-600 hover:text-gray-900'
                    }`}
                  >
                    📄 Bill
                  </button>
                  <button
                    onClick={() => {
                      if (cartItems.length > 0 && billItems.length > 0) {
                        compareCartAndBill();
                      }
                      setActiveTab('compare');
                    }}
                    className={`px-4 py-3 font-medium transition-colors whitespace-nowrap ${
                      activeTab === 'compare'
                        ? 'text-indigo-600 border-b-2 border-indigo-600'
                        : 'text-gray-600 hover:text-gray-900'
                    }`}
                  >
                    ✓ Compare
                  </button>
                </div>
              </div>

              {compressionStatus && (
                <div className="max-w-4xl mx-auto px-4 mt-4">
                  <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center gap-3">
                    <div className="loading-spinner"></div>
                    <span className="text-blue-800 font-medium">{compressionStatus}</span>
                  </div>
                </div>
              )}

              <div className="max-w-4xl mx-auto px-4 py-6">
                {activeTab === 'capture' && (
                  <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-md p-6">
                      <h2 className="text-lg font-semibold mb-4">Capture Item Photos</h2>
                      
                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <button
                          onClick={() => fileInputRef.current?.click()}
                          disabled={isProcessing}
                          className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-indigo-300 rounded-lg hover:border-indigo-500 hover:bg-indigo-50 transition-colors disabled:opacity-50"
                        >
                          <Upload className="w-12 h-12 text-indigo-600 mb-2" />
                          <span className="text-sm font-medium text-gray-700">Upload Photos</span>
                          <span className="text-xs text-gray-500 mt-1">Auto-compressed</span>
                        </button>

                        <button
                          onClick={isCameraActive ? stopCamera : startCamera}
                          disabled={isProcessing}
                          className={`flex flex-col items-center justify-center p-6 border-2 border-dashed rounded-lg transition-colors disabled:opacity-50 ${
                            isCameraActive
                              ? 'border-red-300 hover:border-red-500 hover:bg-red-50'
                              : 'border-indigo-300 hover:border-indigo-500 hover:bg-indigo-50'
                          }`}
                        >
                          <Camera className={`w-12 h-12 mb-2 ${isCameraActive ? 'text-red-600' : 'text-indigo-600'}`} />
                          <span className="text-sm font-medium text-gray-700">
                            {isCameraActive ? 'Stop Camera' : 'Use Camera'}
                          </span>
                        </button>
                      </div>

                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        multiple
                        onChange={handleFileUpload}
                        className="hidden"
                      />

                      {isCameraActive && (
                        <div className="mb-6">
                          <div className="relative bg-black rounded-lg overflow-hidden">
                            <video
                              ref={videoRef}
                              autoPlay
                              playsInline
                              className="w-full"
                            />
                            <button
                              onClick={capturePhoto}
                              disabled={isProcessing}
                              className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white hover:bg-gray-100 text-gray-900 font-medium px-6 py-3 rounded-full shadow-lg transition-colors disabled:opacity-50"
                            >
                              📸 Capture
                            </button>
                          </div>
                          <canvas ref={canvasRef} className="hidden" />
                        </div>
                      )}

                      <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <p className="text-sm text-blue-800">
                          <strong>💡 Tips:</strong> Images are now auto-compressed to prevent crashes. Start with <strong>Demo Mode ON</strong> to test workflow. For real OCR: good lighting, clear text, 5-15s processing time.
                        </p>
                      </div>
                    </div>

                    {(capturedImages.length > 0 || cartItems.length > 0) && (
                      <div className="bg-white rounded-xl shadow-md p-4">
                        <button
                          onClick={() => {
                            if (window.confirm('Clear all data?')) {
                              setCapturedImages([]);
                              setCartItems([]);
                              localStorage.clear();
                            }
                          }}
                          className="w-full px-4 py-2 bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100"
                        >
                          Clear All
                        </button>
                      </div>
                    )}

                    {isProcessing && (
                      <div className="bg-white rounded-xl shadow-md p-8 text-center">
                        <div className="loading-spinner mx-auto mb-4"></div>
                        <p className="text-gray-900 font-medium mb-2">
                          {useDemoMode ? '🎭 Simulating OCR...' : '🔍 Processing with real OCR...'}
                        </p>
                        {!useDemoMode && (
                          <p className="text-sm text-gray-600">This may take 5-15 seconds</p>
                        )}
                      </div>
                    )}

                    {capturedImages.length > 0 && (
                      <div className="bg-white rounded-xl shadow-md p-6">
                        <h2 className="text-lg font-semibold mb-4">Captured Items</h2>
                        <div className="space-y-4">
                          {capturedImages.map(image => (
                            <div key={image.id} className={`border rounded-lg p-4 ${image.confirmed ? 'bg-green-50 border-green-200' : ''}`}>
                              <div className="flex gap-4">
                                <img src={image.imageData} alt="Item" className="w-24 h-24 object-cover rounded-lg" />
                                
                                <div className="flex-1">
                                  {editingItem === image.id ? (
                                    <div className="space-y-2">
                                      <input
                                        type="text"
                                        defaultValue={image.ocrResult.name}
                                        id={`edit-name-${image.id}`}
                                        className="w-full px-3 py-1 border rounded text-sm"
                                      />
                                      <input
                                        type="number"
                                        step="0.01"
                                        defaultValue={image.ocrResult.price}
                                        id={`edit-price-${image.id}`}
                                        className="w-full px-3 py-1 border rounded text-sm"
                                      />
                                      <div className="flex gap-2">
                                        <button
                                          onClick={() => {
                                            const name = document.getElementById(`edit-name-${image.id}`).value;
                                            const price = parseFloat(document.getElementById(`edit-price-${image.id}`).value);
                                            saveEdit(image.id, { name, price });
                                          }}
                                          className="px-3 py-1 bg-indigo-600 text-white text-sm rounded"
                                        >
                                          Save
                                        </button>
                                        <button
                                          onClick={() => setEditingItem(null)}
                                          className="px-3 py-1 bg-gray-200 text-gray-700 text-sm rounded"
                                        >
                                          Cancel
                                        </button>
                                      </div>
                                    </div>
                                  ) : (
                                    <>
                                      <div className="font-medium">{image.ocrResult.name}</div>
                                      <div className="text-lg font-semibold text-indigo-600">Rs.{image.ocrResult.price.toFixed(2)}</div>
                                      {image.ocrResult.weight && (
                                        <div className="text-sm text-gray-600">{image.ocrResult.weight}</div>
                                      )}
                                      <div className="text-xs text-gray-500">
                                        Confidence: {(image.ocrResult.confidence * 100).toFixed(0)}%
                                      </div>
                                    </>
                                  )}
                                </div>

                                <div className="flex flex-col gap-2">
                                  {!image.confirmed && (
                                    <>
                                      <div className="mb-2">
                                        <label className="block text-xs text-gray-600 mb-1">Qty:</label>
                                        <input
                                          type="number"
                                          min="1"
                                          defaultValue={quantityInput[image.id] || 1}
                                          onChange={(e) => setQuantityInput({...quantityInput, [image.id]: parseInt(e.target.value) || 1})}
                                          className="w-16 px-2 py-1 border rounded text-sm"
                                        />
                                      </div>
                                      <button
                                        onClick={() => confirmItem(image.id, quantityInput[image.id] || 1)}
                                        className="p-2 bg-green-600 text-white rounded-lg"
                                      >
                                        <Check className="w-5 h-5" />
                                      </button>
                                      <button
                                        onClick={() => setEditingItem(image.id)}
                                        className="p-2 bg-gray-200 text-gray-700 rounded-lg"
                                      >
                                        <Edit2 className="w-5 h-5" />
                                      </button>
                                    </>
                                  )}
                                  {image.confirmed && (
                                    <div className="text-xs text-green-600 font-medium">✓ Added</div>
                                  )}
                                  <button
                                    onClick={() => deleteImage(image.id)}
                                    className="p-2 bg-red-100 text-red-600 rounded-lg"
                                  >
                                    <X className="w-5 h-5" />
                                  </button>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'cart' && (
                  <div className="bg-white rounded-xl shadow-md p-6">
                    <h2 className="text-lg font-semibold mb-4">Cart</h2>
                    {cartItems.length === 0 ? (
                      <div className="text-center py-12 text-gray-500">
                        <ShoppingCart className="w-16 h-16 mx-auto mb-3 opacity-50" />
                        <p>No items yet</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {cartItems.map(item => (
                          <div key={item.id} className="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                            <div className="flex-1">
                              <div className="font-medium">{item.name}</div>
                              <div className="text-sm text-gray-600">
                                Rs.{item.price.toFixed(2)} × {item.quantity} = Rs.{item.totalPrice.toFixed(2)}
                              </div>
                            </div>
                            <div className="flex gap-2">
                              <button
                                onClick={() => updateQuantity(item.id, item.quantity - 1)}
                                className="px-2 py-1 bg-white border rounded"
                              >
                                −
                              </button>
                              <span className="px-2 py-1">{item.quantity}</span>
                              <button
                                onClick={() => updateQuantity(item.id, item.quantity + 1)}
                                className="px-2 py-1 bg-white border rounded"
                              >
                                +
                              </button>
                              <button
                                onClick={() => setCartItems(prev => prev.filter(i => i.id !== item.id))}
                                className="p-2 text-red-600"
                              >
                                <X className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        ))}
                        <div className="pt-4 border-t">
                          <div className="flex justify-between text-xl font-bold">
                            <span>Total:</span>
                            <span className="text-indigo-600">Rs.{cartItems.reduce((sum, item) => sum + item.totalPrice, 0).toFixed(2)}</span>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'bill' && (
                  <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-md p-6">
                      <h2 className="text-lg font-semibold mb-4">Upload E-Bill</h2>
                      <textarea
                        value={billText}
                        onChange={(e) => setBillText(e.target.value)}
                        placeholder="Paste bill text..."
                        rows="10"
                        className="w-full px-4 py-3 border rounded-lg font-mono text-sm"
                      />
                      <button
                        onClick={parseBill}
                        disabled={!billText.trim()}
                        className="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white font-medium py-3 rounded-lg"
                      >
                        Parse Bill
                      </button>
                    </div>

                    {billItems.length > 0 && (
                      <div className="bg-white rounded-xl shadow-md p-6">
                        <h2 className="text-lg font-semibold mb-4">Parsed Items</h2>
                        {billItems.map((item, idx) => (
                          <div key={idx} className="flex justify-between p-3 bg-gray-50 rounded-lg mb-2">
                            <span>{item.name}</span>
                            <span className="font-medium">Rs.{item.price.toFixed(2)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'compare' && (
                  <div className="bg-white rounded-xl shadow-md p-6">
                    {!showComparison ? (
                      <div className="text-center py-8">
                        <AlertCircle className="w-16 h-16 mx-auto mb-4 text-indigo-600" />
                        <h2 className="text-2xl font-semibold mb-2">Ready to Compare?</h2>
                        <div className="grid grid-cols-2 gap-4 max-w-md mx-auto my-6">
                          <div className="p-4 bg-gray-50 rounded-lg">
                            <div className="text-3xl font-bold text-indigo-600">{cartItems.length}</div>
                            <div className="text-sm">Cart Items</div>
                          </div>
                          <div className="p-4 bg-gray-50 rounded-lg">
                            <div className="text-3xl font-bold text-indigo-600">{billItems.length}</div>
                            <div className="text-sm">Bill Items</div>
                          </div>
                        </div>
                        <button
                          onClick={compareCartAndBill}
                          disabled={cartItems.length === 0 || billItems.length === 0}
                          className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white font-medium rounded-lg"
                        >
                          Compare Now
                        </button>
                      </div>
                    ) : (
                      <>
                        {discrepancies.length === 0 ? (
                          <div className="text-center py-8">
                            <CheckCircle className="w-16 h-16 mx-auto mb-4 text-green-600" />
                            <h3 className="text-xl font-semibold text-green-600">Perfect! 🎉</h3>
                          </div>
                        ) : (
                          <>
                            <h2 className="text-2xl font-semibold mb-6">Issues Found</h2>
                            <div className="grid grid-cols-3 gap-4 mb-6">
                              <div className="p-4 bg-red-50 rounded-lg">
                                <div className="text-2xl font-bold text-red-600">
                                  {discrepancies.filter(d => d.severity === 'high').length}
                                </div>
                                <div className="text-sm">High Priority</div>
                              </div>
                              <div className="p-4 bg-yellow-50 rounded-lg">
                                <div className="text-2xl font-bold text-yellow-600">
                                  {discrepancies.filter(d => d.severity === 'medium').length}
                                </div>
                                <div className="text-sm">Medium</div>
                              </div>
                              <div className="p-4 bg-indigo-50 rounded-lg">
                                <div className="text-2xl font-bold text-indigo-600">
                                  Rs.{calculateTotalIssues().total.toFixed(2)}
                                </div>
                                <div className="text-sm">Loss</div>
                              </div>
                            </div>
                            <div className="space-y-4">
                              {discrepancies.map((issue, idx) => (
                                <div
                                  key={idx}
                                  className={`p-4 rounded-lg border-l-4 ${
                                    issue.severity === 'high' ? 'bg-red-50 border-red-500' : 'bg-yellow-50 border-yellow-500'
                                  }`}
                                >
                                  <div className="font-medium mb-1">{issue.message}</div>
                                  {issue.type === 'price_mismatch' && (
                                    <div className="text-sm">
                                      Expected: Rs.{issue.cartItem.price.toFixed(2)} | 
                                      Billed: Rs.{issue.billItem.price.toFixed(2)}
                                    </div>
                                  )}
                                </div>
                              ))}
                            </div>
                          </>
                        )}
                      </>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<PairShopperApp />, document.getElementById('root'));
    </script>
</body>
</html>
